<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
  <title id="t">SEO company Frisco TX – local business ranking #1 on Google Maps</title>
  <desc id="d">Illustration of a modern Frisco, Texas storefront with a Google search for "seo company frisco" and a #1 Map Pack result.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#9cc8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset=".55" stop-color="#2f5f8f"/>
      <stop offset="1" stop-color="#15263d"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#284b73"/>
      <stop offset="1" stop-color="#162a44"/>
    </linearGradient>
    <pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse">
      <rect width="24" height="12" fill="#cbb79c"/>
      <path d="M0 11.5h24M12 0v6M0 6h24M0 6v6M24 6v6" stroke="#b8a283" stroke-width="1"/>
    </pattern>
    <pattern id="stone" width="30" height="16" patternUnits="userSpaceOnUse">
      <rect width="30" height="16" fill="#8f8a83"/>
      <path d="M0 15.5h30M15 0v8M0 8h30M5 8v8" stroke="#7a756f" stroke-width="1.2"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a0f1e" flood-opacity=".22"/>
    </filter>
    <clipPath id="frame"><rect width="720" height="560" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="720" height="560" fill="url(#sky)"/>
    <circle cx="640" cy="70" r="46" fill="#fff6c9" opacity=".55"/>
    <g fill="#fff" opacity=".75">
      <ellipse cx="120" cy="80" rx="60" ry="14"/><ellipse cx="160" cy="70" rx="40" ry="14"/>
      <ellipse cx="520" cy="130" rx="54" ry="12"/>
    </g>

    <!-- distant building -->
    <rect x="600" y="300" width="140" height="150" fill="#b4754f"/>
    <rect x="612" y="320" width="18" height="22" fill="#7a4a30"/><rect x="642" y="320" width="18" height="22" fill="#7a4a30"/><rect x="672" y="320" width="18" height="22" fill="#7a4a30"/>

    <!-- main building: side wing -->
    <polygon points="330,170 620,250 620,460 330,470" fill="#e9e3d8"/>
    <polygon points="330,330 620,355 620,460 330,470" fill="url(#brick)"/>
    <!-- side windows upper -->
    <g fill="url(#glass2)">
      <polygon points="360,215 400,224 400,288 360,282"/>
      <polygon points="420,229 460,238 460,296 420,291"/>
      <polygon points="480,243 520,252 520,304 480,299"/>
      <polygon points="540,257 580,266 580,312 540,308"/>
    </g>
    <!-- side storefront glass -->
    <g fill="url(#glass)">
      <polygon points="360,372 430,377 430,466 360,468"/>
      <polygon points="450,379 520,384 520,463 450,465"/>
      <polygon points="540,386 605,390 605,461 540,462"/>
    </g>
    <polygon points="330,345 620,368 620,378 330,357" fill="#3c3f45"/>
    <!-- pilasters side -->
    <g fill="url(#stone)">
      <polygon points="440,226 450,229 450,468 440,468"/>
      <polygon points="530,252 540,255 540,465 530,465"/>
    </g>

    <!-- main building: front corner -->
    <polygon points="110,190 210,120 330,170 330,470 110,470" fill="#ebe6dc"/>
    <polygon points="110,300 330,300 330,470 110,470" fill="url(#brick)"/>
    <!-- corner stone tower -->
    <polygon points="300,150 345,168 345,470 300,470" fill="url(#stone)"/>
    <polygon points="95,200 130,178 130,470 95,470" fill="url(#stone)"/>
    <!-- gable outline -->
    <polyline points="104,194 210,118 340,170" fill="none" stroke="#d7d0c2" stroke-width="8" stroke-linejoin="round"/>
    <!-- upper front windows -->
    <g fill="url(#glass2)">
      <rect x="150" y="220" width="28" height="64" rx="2"/>
      <rect x="186" y="220" width="28" height="64" rx="2"/>
      <rect x="222" y="220" width="28" height="64" rx="2"/>
      <rect x="258" y="220" width="28" height="64" rx="2"/>
    </g>
    <!-- sign -->
    <rect x="148" y="160" width="140" height="44" rx="6" fill="#0a0f1e"/>
    <circle cx="172" cy="182" r="12" fill="#16a34a"/>
    <path d="M166 182l4 4 8-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="192" y="178" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">YOUR</text>
    <text x="192" y="194" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#4ade80">BUSINESS</text>
    <!-- awning -->
    <polygon points="120,312 300,312 312,330 108,330" fill="#2f3237"/>
    <!-- storefront glass -->
    <rect x="138" y="338" width="64" height="128" fill="url(#glass)"/>
    <rect x="212" y="338" width="80" height="128" fill="url(#glass)"/>
    <line x1="252" y1="338" x2="252" y2="466" stroke="#0e1a2b" stroke-width="3"/>
    <rect x="232" y="350" width="40" height="16" rx="3" fill="#1d4ed8"/>
    <text x="252" y="362" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">OPEN</text>
    <path d="M150 350l30 30M150 372l40 40" stroke="#fff" stroke-opacity=".15" stroke-width="6"/>

    <!-- sidewalk & trees -->
    <polygon points="0,466 720,452 720,560 0,560" fill="#d9d6cf"/>
    <polygon points="0,500 720,488 720,560 0,560" fill="#bfbab1"/>
    <g>
      <rect x="402" y="420" width="5" height="62" fill="#6b4f33"/>
      <circle cx="404" cy="418" r="26" fill="#5c8f3a"/><circle cx="392" cy="404" r="16" fill="#6fa646"/>
      <rect x="560" y="418" width="5" height="58" fill="#6b4f33"/>
      <circle cx="562" cy="414" r="22" fill="#5c8f3a"/><circle cx="574" cy="402" r="14" fill="#6fa646"/>
    </g>

    <!-- search bar card -->
    <g filter="url(#sh)">
      <rect x="370" y="34" width="318" height="56" rx="28" fill="#fff"/>
    </g>
    <circle cx="402" cy="62" r="9" fill="none" stroke="#5d6573" stroke-width="2.6"/>
    <line x1="409" y1="69" x2="415" y2="75" stroke="#5d6573" stroke-width="2.6" stroke-linecap="round"/>
    <text x="428" y="68" font-family="Poppins, Arial, sans-serif" font-size="17" font-weight="600" fill="#0a0f1e">seo company frisco</text>
    <rect x="626" y="50" width="2" height="24" fill="#16a34a"/>

    <!-- map pack result card -->
    <g filter="url(#sh)">
      <rect x="396" y="108" width="292" height="118" rx="18" fill="#fff"/>
    </g>
    <rect x="412" y="124" width="64" height="86" rx="10" fill="#e8f5e9"/>
    <path d="M444 140c-10 0-17 7.5-17 17 0 12.5 17 30 17 30s17-17.5 17-30c0-9.5-7-17-17-17z" fill="#16a34a"/>
    <circle cx="444" cy="157" r="6.5" fill="#fff"/>
    <rect x="488" y="126" width="34" height="20" rx="10" fill="#16a34a"/>
    <text x="505" y="140" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">#1</text>
    <text x="530" y="141" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a0f1e">Your Business</text>
    <text x="488" y="166" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="700" fill="#0a0f1e">4.9</text>
    <text x="512" y="167" font-family="Arial, sans-serif" font-size="14" fill="#f59e0b" letter-spacing="1">★★★★★</text>
    <text x="604" y="166" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#5d6573">(128)</text>
    <text x="488" y="187" font-family="Poppins, Arial, sans-serif" font-size="12" fill="#5d6573">SEO agency · Frisco, TX</text>
    <text x="488" y="205" font-family="Poppins, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a">Open now · Call · Directions</text>

    <!-- floating pin over building -->
    <g filter="url(#sh)">
      <path d="M220 40c-20 0-35 15-35 34 0 26 35 60 35 60s35-34 35-60c0-19-15-34-35-34z" fill="#16a34a"/>
    </g>
    <circle cx="220" cy="74" r="13" fill="#fff"/>
    <path d="M214 74l4 4 8-8" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
